server {
    server_name matraspremier.uz www.matraspremier.uz;

    root /var/www/matraspremier-front;
    index index.html;

    access_log /var/log/nginx/matraspremier.uz.access.log;
    error_log  /var/log/nginx/matraspremier.uz.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/matraspremier.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/matraspremier.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.matraspremier.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = matraspremier.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name matraspremier.uz www.matraspremier.uz;
    return 404; # managed by Certbot
}
